<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=edge" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jqueryui/1.12.1/jquery-ui.min.css" />
  <link rel="stylesheet" type="text/css" href="/static/style.css" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <style>
    :root { --qb-green: #2ca01c; --qb-dark: #0b1120; --qb-muted: #6b7280; --qb-border: #e5e7eb; --qb-bg: #f3f4f6; }
    body { background: var(--qb-bg); }
    .layout { display: flex; min-height: 100vh; }
    .qb-sidebar { width: 240px; background: #fff; border-right: 1px solid var(--qb-border); display: flex; flex-direction: column; }
    .qb-logo { display: flex; align-items: center; gap: 10px; padding: 18px 16px; font-weight: 700; color: var(--qb-dark); border-bottom: 1px solid var(--qb-border); }
    .qb-logo .dot { width: 10px; height: 10px; background: var(--qb-green); border-radius: 50%; }
    .qb-nav { padding: 12px; flex: 1; overflow-y: auto; }
    .qb-nav a { display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin: 4px 0; color: #111827; text-decoration: none; border-radius: 8px; font-size: 14px; }
    .qb-nav a .fa { width: 18px; text-align: center; color: var(--qb-muted); }
    .qb-nav a:hover { background: #f0fdf4; color: #065f46; }
    .qb-nav a.active { background: #ecfdf5; color: #065f46; border-left: 4px solid var(--qb-green); }
    .qb-nav .dropdown-menu { background: #fff; border: 1px solid var(--qb-border); }
    .qb-footer { padding: 12px; border-top: 1px solid var(--qb-border); }
    .qb-footer a { display: block; text-decoration: none; color: #ef4444; font-weight: 600; }
    .qb-main { flex: 1; display: flex; flex-direction: column; }
    .qb-topbar { height: 56px; background: #fff; border-bottom: 1px solid var(--qb-border); display: flex; align-items: center; justify-content: flex-end; padding: 0 16px; }
    .qb-content { padding: 16px; }
  </style>
</head>
<body>
  <div class="layout">
    <aside class="qb-sidebar">
      <div class="qb-logo"><span class="dot"></span> Admin Apps</div>
      <nav class="qb-nav">
        <a href="/employee-list/"><i class="fa fa-users"></i> Employee</a>
        <a href="/inventory-list/"><i class="fa fa-box"></i> Inventory</a>
        <a href="/api-accountability/"><i class="fa fa-clipboard-check"></i> Accountability</a>
        <div class="dropdown">
          <a class="dropdown-toggle" href="#" role="button" id="dropdownMenuLink" data-bs-toggle="dropdown" aria-expanded="false">
            <i class="fa fa-user-shield"></i> Inventory-Admin
          </a>

          <ul class="dropdown-menu" aria-labelledby="dropdownMenuLink">
            <li><a class="dropdown-item" href="/supplier/">Supplier</a></li>
            <li><a class="dropdown-item" href="/inventory-supply/">Inventory Supply</a></li>
            <li><a class="dropdown-item" href="/inventory-management/">Inventory Management</a></li>
            <li><a class="dropdown-item" href="/management-transactions/">Inventory Costing</a></li>
          </ul>
        </div>
        <a href="/api-purchase-order-temp/"><i class="fa fa-file-invoice"></i> Purchase Order</a>
        <a href="/ticketing/"><i class="fa fa-ticket"></i> Job Order</a>
        <a href="/api-repair/"><i class="fa fa-tools"></i> Repair</a>
        <a href="/rental-printer/"><i class="fa fa-print"></i> Rental Printer</a>
        <a href="/check-printing/"><i class="fa fa-money-check-alt"></i> Check Printing</a>
        <!-- <a href="/api-payroll-temp/"><i class="fa fa-user-plus"></i> Payroll Add Employee</a> -->
        <!-- <a href="/api-payroll-computation/"><i class="fa fa-calculator"></i> Payroll Computation</a> -->
        <!-- <a href="/api-payroll-comp2/"><i class="fa fa-calculator"></i> Payroll Computation 2</a>  -->
        <a href="/logs/"><i class="fa fa-stream"></i> Logs</a>
      </nav>
      <div class="qb-footer">
        <a href="/logout/">Sign out</a>
      </div>
    </aside>

    <div class="qb-main">
      <header class="qb-topbar"></header>
      <main id="main" class="qb-content">
        {% block content %}{% endblock %}
      </main>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.2/dist/js/bootstrap.bundle.min.js"></script>
  <script>
    // Highlight active link based on current path
    (function() {
      var path = location.pathname;
      document.querySelectorAll('.qb-nav a').forEach(function(a){
        if (a.getAttribute('href') === path) { a.classList.add('active'); }
      });
    })();
  </script>
</body>
</html>
