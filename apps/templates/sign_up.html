<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign up · Admin Apps</title>
  <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.5.1/jquery.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet" />
</head>
<body class="bg-gray-100 min-h-screen">
  <div class="flex flex-col items-center justify-center min-h-screen px-4">
    <div class="mb-6 text-center">
      <div class="text-2xl font-semibold text-gray-900">Create your account</div>
    </div>

    <div class="w-full max-w-sm bg-white border border-gray-200 rounded-md shadow-sm">
      <div class="px-6 py-6">
        <div id="message" class="text-sm mb-3"></div>

        <form id="sign-up-form" class="space-y-4">
          <div>
            <label for="fullname" class="block text-sm font-medium text-gray-700">Name</label>
            <input id="fullname" type="text" required class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
          </div>
          <div>
            <label for="username" class="block text-sm font-medium text-gray-700">Email address</label>
            <input id="username" type="email" required autocomplete="email" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
          </div>
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700">Password</label>
            <input id="password" type="password" required minlength="8" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
            <p class="text-xs text-gray-500 mt-1">Must be at least 8 characters</p>
          </div>
          <div>
            <label for="password2" class="block text-sm font-medium text-gray-700">Confirm password</label>
            <input id="password2" type="password" required minlength="8" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm focus:border-indigo-500 focus:ring-indigo-500" />
          </div>
          <button type="submit"
            class="w-full inline-flex justify-center items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
            Create account
          </button>
        </form>
      </div>
    </div>

    <div class="mt-4 w-full max-w-sm text-center text-sm text-gray-700">
      Already have an account?
      <a href="/" class="text-indigo-600 hover:text-indigo-500 font-medium">Sign in</a>
    </div>
  </div>

  <script src="static/sign_up.js"></script>
</body>
</html>
